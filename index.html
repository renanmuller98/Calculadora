<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>Calculadora</title>
</head>
<body>

    <div class="container">

        <div class="calc"> 

            <p id="calc"></p>
            <p id="result"></p>

        <table>
            <tr>
                <td><button class="btn-calculate" id="btn-math" value="+" onclick="mathOperator(this.value)">+</button></td>
                <td><button class="btn-calculate" id="btn-math" value="-" onclick="mathOperator(this.value)">-</button></td>
                <td><button class="btn-calculate" id="btn-math" value="*" onclick="mathOperator(this.value)">x</button></td>
                <td><button class="btn-calculate" id="btn-math" value="/" onclick="mathOperator(this.value)">/</button></td>
            </tr>
            <tr>
                <td><button class="btn" id="btn-number" value="7" onclick="getNumberValue(this.value)">7</button></td>
                <td><button class="btn" id="btn-number" value="8" onclick="getNumberValue(this.value)">8</button></td>
                <td><button class="btn" id="btn-number" value="9" onclick="getNumberValue(this.value)">9</button></td>
                <td rowspan="4"><button class="result-btn" id="btn-result">=</button></td>
            </tr>
            <tr>
                <td><button class="btn" id="btn-number" value="4" onclick="getNumberValue(this.value)">4</button></td>
                <td><button class="btn" id="btn-number" value="5" onclick="getNumberValue(this.value)">5</button></td>
                <td><button class="btn" id="btn-number" value="6" onclick="getNumberValue(this.value)">6</button></td>
            </tr>
            <tr>
                <td><button class="btn" id="btn-number" value="1" onclick="getNumberValue(this.value)">1</button></td>
                <td><button class="btn" id="btn-number" value="2" onclick="getNumberValue(this.value)">2</button></td>
                <td><button class="btn" id="btn-number" value="3" onclick="getNumberValue(this.value)">3</button></td>
            </tr>
            <tr>
                <td><button class="btn" id="btn-number" value="0" onclick="getNumberValue(this.value)">0</button></td>
                <td><button class="btn" id="btn-dot" value="." onclick="getDotBtn(this.value)">,</button></td>
                <td><button class="btn" id="btn-clear">C</button></td>
            </tr>
        </table>

        </div>
        
    </div>
    
</body>
</html>
